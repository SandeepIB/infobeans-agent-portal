# InfoBeans Agent Hub — Nginx virtual host
# Enable: sudo ln -sf /var/www/html/infobeans-agent-portal/config/nginx.conf /etc/nginx/sites-enabled/infobeans-agent-hub
# Reload:  sudo nginx -s reload

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name agenthub.creatingwow.in;
    return 301 https://$host$request_uri;
}

# HTTPS — main hub
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agenthub.creatingwow.in;

    ssl_certificate     /var/www/html/infobeans-agent-portal/config/ssl/fullchain.crt;
    ssl_certificate_key /var/www/html/infobeans-agent-portal/config/ssl/creatingwow.in.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options            "SAMEORIGIN"                         always;
    add_header X-Content-Type-Options     "nosniff"                            always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"    always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # Static files served directly by Nginx
    location /static/ {
        alias /var/www/html/infobeans-agent-portal/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Hub FastAPI backend (port 8000)
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 64m;
    }
}
