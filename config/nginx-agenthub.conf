# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name agenthub.creatingwow.in;
    return 301 https://$host$request_uri;
}

# InfoBeans Agent Hub — HTTPS
server {
    listen 443 ssl http2;
    server_name agenthub.creatingwow.in;

    ssl_certificate     /etc/ssl/creatingwow/fullchain.crt;
    ssl_certificate_key /etc/ssl/creatingwow/creatingwow.in.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL_ib:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/agenthub-access.log main;
    error_log  /var/log/nginx/agenthub-error.log;

    # Trailing-slash redirect for PPT Validator React app (StaticFiles redirects /app → /app/ using
    # the internal 127.0.0.1 URL; intercept here so the browser stays on the public domain).
    location = /ppt-validator/app {
        return 301 /ppt-validator/app/;
    }

    # PPT Validator API calls — React app uses /api/v1/ and /api/v2/ as absolute paths.
    # Rewrite through the hub's /ppt-validator/ proxy so auth + permission checks still apply.
    location ~ ^/(api/v[12]/)(.*)$ {
        proxy_pass         http://172.26.0.1:8000/ppt-validator/$1$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 64m;
    }

    # Everything else → Agent Hub FastAPI
    location / {
        proxy_pass         http://172.26.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 64m;
    }
}
