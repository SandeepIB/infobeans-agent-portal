<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IB PPT Validator — Legacy</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #003087; }
    .notice { background: #fff3cd; border: 1px solid #ffc107; padding: 12px; border-radius: 4px; margin-bottom: 20px; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input[type=file], button { padding: 10px; }
    button { background: #003087; color: white; border: none; cursor: pointer; border-radius: 4px; }
    #result { margin-top: 20px; white-space: pre-wrap; background: #f5f5f5; padding: 16px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>InfoBeans PPT Validator</h1>
  <div class="notice">
    <strong>Note:</strong> This is the legacy UI. The new platform is available at
    <a href="http://localhost:5173">http://localhost:5173</a> (dev) or served from <code>frontend/dist</code>.
  </div>
  <form id="uploadForm">
    <label><strong>Upload PPTX file:</strong></label>
    <input type="file" id="file" name="file" accept=".pptx" required>
    <button type="submit">Validate</button>
  </form>
  <div id="result"></div>
  <script>
    document.getElementById('uploadForm').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData();
      fd.append('file', document.getElementById('file').files[0]);
      document.getElementById('result').textContent = 'Validating...';
      try {
        const r = await fetch('/validate', {method: 'POST', body: fd});
        const data = await r.json();
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById('result').textContent = 'Error: ' + err;
      }
    };
  </script>
</body>
</html>
