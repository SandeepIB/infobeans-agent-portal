<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Admin{% endblock %} — InfoBeans Agent Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500&display=swap">
<link rel="stylesheet" href="/static/portal.css">
<style>
:root{--side-w:220px}
.adm{display:flex;min-height:100vh}
.adm-side{width:var(--side-w);background:var(--side);color:var(--side-ink);padding:24px 0;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.adm-side .brand{padding:0 20px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.1)}
.adm-side .brand .lg{filter:brightness(0) invert(1)}
.adm-side nav{padding:16px 0}
.adm-side nav a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:rgba(255,255,255,.7);text-decoration:none;font-size:.9rem;transition:all .15s}
.adm-side nav a:hover,.adm-side nav a.active{background:rgba(255,255,255,.1);color:#fff}
.adm-side nav a svg{width:18px;height:18px;flex-shrink:0}
.adm-side .out-link{padding:20px;border-top:1px solid rgba(255,255,255,.1);margin-top:auto}
.adm-side .out-link a{color:rgba(255,255,255,.5);font-size:.85rem;text-decoration:none}
.adm-main{flex:1;padding:32px;overflow-y:auto;background:var(--bg)}
.adm-header{margin-bottom:28px}
.adm-header h1{margin:0 0 4px;font-size:1.4rem;font-weight:500}
.adm-header p{margin:0;color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:400;border-bottom:2px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.75rem;font-weight:400}
.badge-green{background:#d4f7e7;color:#1a7a4a}
.badge-red{background:#fee;color:#b91c1c}
.badge-grey{background:var(--line);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.85rem;cursor:pointer;font-family:inherit;text-decoration:none}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-primary:hover{opacity:.9;background:var(--accent)}
.btn-danger{background:#fee;color:#b91c1c;border-color:#f99}
.btn-danger:hover{background:#fdd}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:.85rem;color:var(--muted)}
.form-group input,.form-group select{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:7px;font:inherit;background:var(--surface);color:var(--ink)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--surface);border-radius:12px;padding:28px;width:460px;max-width:95vw}
.modal h3{margin:0 0 20px;font-size:1.1rem}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.stats-row{display:flex;gap:16px;margin-bottom:24px}
.stat-card{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.stat-card .num{font-size:2rem;font-weight:500;color:var(--accent)}
.stat-card .lbl{font-size:.85rem;color:var(--muted)}
.alert{padding:10px 14px;border-radius:7px;font-size:.9rem;margin-bottom:16px}
.alert-success{background:#d4f7e7;color:#1a7a4a;border:1px solid #86e0b5}
.alert-error{background:#fee;color:#b91c1c;border:1px solid #f99}
</style>
</head>
<body>
<div class="adm">
  <aside class="adm-side">
    <div class="brand">
      <span class="lg" style="--w:90px" role="img" aria-label="InfoBeans"></span>
      <span style="font-size:.75rem;color:rgba(255,255,255,.5);margin-top:2px">Admin</span>
    </div>
    <nav>
      <a href="/admin" class="{% if active=='dashboard' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a href="/admin/users" class="{% if active=='users' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2M16 3.13a4 4 0 010 7.75"/><path d="M21 21v-2a4 4 0 00-3-3.87"/></svg>
        Users
      </a>
      <a href="/admin/apps" class="{% if active=='apps' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Applications
      </a>
      <a href="/admin/permissions" class="{% if active=='permissions' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        Permissions
      </a>
    </nav>
    <div class="out-link" style="margin-top:auto;padding-top:16px">
      <a href="/">← Back to Hub</a><br><br>
      <span style="font-size:.8rem;color:rgba(255,255,255,.4)">{{ user.email }}</span>
    </div>
  </aside>
  <main class="adm-main">
    {% block content %}{% endblock %}
  </main>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
function toast(m,ok){var t=document.getElementById("toast");t.textContent=m;t.style.background=ok===false?"#b91c1c":undefined;t.classList.remove("hidden");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add("hidden"),3000)}
function api(method,url,body){
  return fetch(url,{method,credentials:"same-origin",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined})
    .then(r=>r.ok?r.json():r.json().then(e=>{throw new Error(e.detail||"Error")}))
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
