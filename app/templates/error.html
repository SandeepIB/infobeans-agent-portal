<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Error {{ status_code }} — InfoBeans Agent Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500&display=swap">
<link rel="stylesheet" href="/static/portal.css">
<style>
.error-page{min-height:100vh;display:flex;align-items:center;justify-content:center}
.error-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:48px;text-align:center;max-width:420px}
.error-card h1{font-size:4rem;margin:0 0 8px;color:var(--brand)}
.error-card h2{margin:0 0 16px;font-weight:400}
.error-card a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="error-page">
  <div class="error-card">
    <h1>{{ status_code }}</h1>
    <h2>{% if status_code == 401 %}Authentication Required{% elif status_code == 403 %}Access Denied{% elif status_code == 404 %}Not Found{% else %}Error{% endif %}</h2>
    <p>{{ detail }}</p>
    <a href="/">← Back to Agent Hub</a>
  </div>
</div>
</body>
</html>
